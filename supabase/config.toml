project_id = "personal-expense-tracker"

[api]
enabled = true
schemas = ["public", "sync"]
extra_search_path = ["public", "extensions"]

# M9C AI category suggestions. The gateway's legacy JWT check does not support
# asymmetric signing keys, so the function verifies every caller itself with
# auth.getClaims() before reading the request body. It is not an open endpoint.
[functions.suggest-expense-category]
verify_jwt = false

# M9D Spending Insights explanations. Same reason: verified in the function.
[functions.explain-financial-insight]
verify_jwt = false
